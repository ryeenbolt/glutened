# codemagic.yaml — cloud build for glutened. (Ryan: no Mac, so iOS builds happen here.)
#
# STATUS (Oct 18, 2026): code signing and App Store publishing are NOT configured
# in this file yet. They require Ryan's Apple Developer account and the
# App Store Connect integration inside Codemagic (Teams > Integrations).
# Codemagic's validator rejects the ios_signing / publishing blocks until that
# integration exists, so those sections were removed on purpose — they get
# added back (with the fetch-signing-files step) once Apple is connected.
# Everything else — install, Capacitor sync, .ipa build — is ready.

workflows:
  ios-workflow:
    name: glutened iOS build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        APP_ID: com.glutened.app          # must match capacitor.config.json appId
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install web dependencies
        script: |
          npm ci || npm install
      - name: Generate the iOS platform project
        script: |
          # First build ever: creates ios/App from capacitor.config.json.
          # On later builds the folder is reused.
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
